[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
vigil-btf = { path = "crates/vigil-btf" }
vigil-core = { path = "crates/vigil-core" }
vigil-codegen-llvm = { path = "crates/vigil-codegen-llvm" }
vigil-codegen-bpf = { path = "crates/vigil-codegen-bpf" }
vigil-diagnostics = { path = "crates/vigil-diagnostics" }
vigil-sema = { path = "crates/vigil-sema" }
vigil-syntax = { path = "crates/vigil-syntax" }
vigil-target = { path = "crates/vigil-target" }
vigil-driver = { path = "crates/vigil-driver" }

ariadne = "0.6"
clap = { version = "4.6", features = ["derive"] }
insta = "1.49"
la-arena = "0.3"
logos = "0.16"
object = { version = "0.40", default-features = false, features = ["read", "std"] }
rowan = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
wasm-bindgen = "=0.2.126"

[profile.release.package.vigil-wasm]
opt-level = "s"
